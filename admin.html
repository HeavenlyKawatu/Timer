<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Pro Timer Lomba Motor</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --asphalt:#0b0b0d; --panel:#17171a; --panel-alt:#1d1d21; --line:#2b2b30;
    --chrome:#f1f1ef; --dim:#87878e; --amber:#ffb400; --go:#14d97a; --stop:#ef1f3a;
    --radius:16px;
    --font-display:'Orbitron',monospace; --font-head:'Barlow Condensed',sans-serif; --font-body:'Barlow',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--asphalt);color:var(--chrome);font-family:var(--font-body);min-height:100vh;}
  button,input{font-family:inherit;}
  .screen{min-height:100vh;display:none;flex-direction:column;}
  .screen.active{display:flex;}
  .checker{height:7px;width:100%;flex:none;background-image:linear-gradient(45deg,var(--line) 25%,transparent 25%,transparent 75%,var(--line) 75%),linear-gradient(45deg,var(--line) 25%,transparent 25%,transparent 75%,var(--line) 75%);background-size:14px 14px;background-position:0 0,7px 7px;opacity:.6;}
  .panel-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);}
  .panel-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;padding:22px 20px 44px;text-align:center;}
  .timer{font-family:var(--font-display);font-weight:800;font-size:3.4rem;font-variant-numeric:tabular-nums;letter-spacing:.01em;}
  .timer-lg{font-size:4.6rem;}
  .tree-container{display:flex;flex-direction:column;gap:8px;background:var(--panel-alt);padding:15px;border-radius:12px;border:2px solid var(--line);}
  .light-row{display:flex;gap:12px;justify-content:center;}
  .light{width:30px;height:30px;border-radius:50%;background:#111;border:2px solid var(--line);transition:all 0.1s;}
  .light.on-red{background:var(--stop);box-shadow:0 0 15px var(--stop);}
  .light.on-yellow{background:var(--amber);box-shadow:0 0 15px var(--amber);}
  .light.on-green{background:var(--go);box-shadow:0 0 25px var(--go);}
  .countdown-text{font-size:2rem;font-family:var(--font-display);color:var(--amber);margin-top:10px;height:40px;}
  .action-btn{width:100%;max-width:320px;padding:20px;border-radius:var(--radius);border:none;font-family:var(--font-head);font-weight:700;font-size:24px;cursor:pointer;}
  .action-start{background:var(--go);color:#000;}
  .action-finish{background:var(--stop);color:#fff;}
  .action-btn:disabled{opacity:0.3;cursor:not-allowed;}
  .history-table{width:100%;max-width:500px;border-collapse:collapse;margin-top:20px;}
  .history-table th, .history-table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;}
  .history-table th{color:var(--amber);}
  .rank-1{color:var(--amber);font-weight:bold;}
  .rank-2{color:#C0C0C0;}
  .rank-3{color:#CD7F32;}
  .tools-row{display:flex;gap:10px;justify-content:center;margin-top:20px;}
  .btn-sm{padding:8px 12px;background:var(--line);color:#fff;border:none;border-radius:8px;cursor:pointer;}
  #qrcode{background:#fff;padding:10px;border-radius:8px;margin-top:10px;}
</style>
</head>
<body>

<div id="app">
  <div id="role-select" class="screen active">
    <div class="checker"></div>
    <div style="margin:auto;max-width:400px;width:100%;padding:20px;">
      <h1 style="text-align:center;font-family:var(--font-head);color:var(--amber);">🏆 ADMIN PANEL</h1>
      <button class="action-btn" style="background:var(--line);color:#fff;margin-bottom:10px;" onclick="initSystem('start')">🚦 Petugas Start</button>
      <button class="action-btn" style="background:var(--line);color:#fff;margin-bottom:10px;" onclick="initSystem('finish')">🏁 Petugas Finish</button>
      <button class="action-btn" style="background:var(--line);color:#fff;" onclick="initSystem('monitor')">📊 Monitor Utama</button>
    </div>
  </div>

  <div id="start-panel" class="screen">
    <div class="panel-header">
      <button class="btn-sm" onclick="location.reload()">‹ Kembali</button>
      <span id="conn-start" style="color:var(--dim)">Menghubungkan...</span>
    </div>
    <div class="panel-body">
      <div class="tree-container">
        <div class="light-row"><div class="light" id="l-red-1"></div></div>
        <div class="light-row"><div class="light" id="l-yel-1"></div><div class="light" id="l-yel-2"></div></div>
        <div class="light-row"><div class="light" id="l-grn-1"></div></div>
      </div>
      <div class="countdown-text" id="cd-text-start">MENUNGGU</div>
      <div class="timer" id="timer-start">00:00.000</div>
      
      <input type="text" id="racer-name" placeholder="Nama Peserta / Nomor" style="padding:15px;width:100%;max-width:320px;border-radius:8px;">
      <button class="action-btn action-start" id="btn-start" onclick="triggerCountdown()">MULAI (3-2-1)</button>
      
      <div style="display:flex;gap:10px;margin-top:10px;width:100%;max-width:320px;">
        <button class="btn-sm" style="background:var(--amber);color:#000;flex:1;padding:12px;font-weight:600;" onclick="resetTimer()">🔄 Reset Waktu</button>
        <button class="btn-sm" style="background:var(--stop);color:#fff;flex:1;padding:12px;font-weight:600;" onclick="confirmResetSystem()">🗑️ Reset Sistem</button>
      </div>
    </div>
  </div>

  <div id="finish-panel" class="screen">
    <div class="panel-header">
      <button class="btn-sm" onclick="location.reload()">‹ Kembali</button>
      <span id="conn-finish" style="color:var(--dim)">Menghubungkan...</span>
    </div>
    <div class="panel-body">
      <h2 style="font-family:var(--font-head);color:var(--dim);">GARIS FINISH</h2>
      <div class="countdown-text" id="cd-text-finish">MENUNGGU</div>
      <div class="timer timer-lg" id="timer-finish">00:00.000</div>
      <button class="action-btn action-finish" id="btn-finish" onclick="triggerFinish()" disabled>🏁 FINISH</button>
    </div>
  </div>

  <div id="monitor-panel" class="screen">
    <div class="panel-header">
      <button class="btn-sm" onclick="location.reload()">‹ Kembali</button>
      <span id="conn-monitor" style="color:var(--dim)">Menghubungkan...</span>
    </div>
    <div class="panel-body">
      <div class="tree-container" style="transform:scale(0.8);">
        <div class="light-row"><div class="light" id="l-red-m"></div></div>
        <div class="light-row"><div class="light" id="l-yel-m1"></div><div class="light" id="l-yel-m2"></div></div>
        <div class="light-row"><div class="light" id="l-grn-m"></div></div>
      </div>
      <div class="timer timer-lg" id="timer-monitor" style="color:var(--amber);">00:00.000</div>
      
      <div style="width:100%;max-width:500px;text-align:left;margin-top:10px;">
        <h3 style="font-family:var(--font-head);">🏆 LIVE LEADERBOARD (TERCEPAT)</h3>
        <table class="history-table">
          <thead><tr><th>Pos</th><th>Peserta</th><th>Waktu</th></tr></thead>
          <tbody id="leaderboard-body">
            <tr><td colspan="3" style="text-align:center;">Belum ada data</td></tr>
          </tbody>
        </table>
      </div>

      <div class="tools-row">
        <button class="btn-sm" style="background:#1d6f42;" onclick="exportCSV()">📥 Export Excel (CSV)</button>
        <button class="btn-sm" onclick="document.getElementById('qr-modal').style.display='block'">📱 QR Penonton</button>
      </div>

      <div id="qr-modal" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--panel);padding:20px;border-radius:12px;border:2px solid var(--line);z-index:99;">
        <h3 style="margin-top:0;font-family:var(--font-head);">Scan untuk Penonton</h3>
        <div id="qrcode"></div>
        <button class="btn-sm" style="width:100%;margin-top:15px;background:var(--stop);" onclick="document.getElementById('qr-modal').style.display='none'">Tutup</button>
      </div>
    </div>
  </div>
</div>

<script>
  let socket, role = '';
  let state = { status: 'idle', startTime: null, finishTime: null, racer: '' };
  let leaderboard = [];
  
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  const audioCtx = new AudioContext();

  function playSound(type) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.connect(gainNode); gainNode.connect(audioCtx.destination);
    if(type === 'beep') {
      osc.type = 'sine'; osc.frequency.value = 800;
      gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if(type === 'horn') {
      osc.type = 'sawtooth'; osc.frequency.value = 300;
      gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
      osc.start(); osc.stop(audioCtx.currentTime + 0.8);
    }
  }

  function initSystem(selectedRole) {
    role = selectedRole;
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(role + '-panel').classList.add('active');
    
    socket = io();
    
    socket.on('connect', () => {
      document.getElementById('conn-' + role).textContent = '🟢 Online';
      if(role === 'monitor') generateQR();
    });

    socket.on('disconnect', () => {
      document.getElementById('conn-' + role).textContent = '🔴 Offline';
    });

    socket.on('sync_state', (newState) => { state = newState; updateUI(); });
    socket.on('sync_leaderboard', (data) => { leaderboard = data.sort((a, b) => a.duration - b.duration); renderLeaderboard(); });
    socket.on('countdown_step', (step) => { runChristmasTree(step); });

    setInterval(tick, 10);
  }

  function triggerCountdown() {
    if(state.status !== 'idle') return;
    const racer = document.getElementById('racer-name').value || 'Anonim';
    socket.emit('start_countdown', racer);
  }

  function triggerFinish() {
    if(state.status !== 'running') return;
    socket.emit('trigger_finish', Date.now());
  }

  function resetTimer() {
    socket.emit('reset_timer');
  }

  function confirmResetSystem() {
    if(confirm('PERINGATAN: Semua data leaderboard dan riwayat juara akan terhapus permanen. Lanjutkan?')) {
      socket.emit('reset_system');
    }
  }

  function runChristmasTree(step) {
    document.querySelectorAll('.light').forEach(l => l.className = 'light');
    const texts = document.querySelectorAll('.countdown-text');
    if(step === 3) { playSound('beep'); document.getElementById('l-red-1')?.classList.add('on-red'); document.getElementById('l-red-m')?.classList.add('on-red'); texts.forEach(t => t.textContent = '3...'); } 
    else if(step === 2) { playSound('beep'); document.getElementById('l-yel-1')?.classList.add('on-yellow'); document.getElementById('l-yel-m1')?.classList.add('on-yellow'); texts.forEach(t => t.textContent = '2...'); } 
    else if(step === 1) { playSound('beep'); document.getElementById('l-yel-2')?.classList.add('on-yellow'); document.getElementById('l-yel-m2')?.classList.add('on-yellow'); texts.forEach(t => t.textContent = '1...'); } 
    else if(step === 'GO') { playSound('horn'); document.getElementById('l-grn-1')?.classList.add('on-green'); document.getElementById('l-grn-m')?.classList.add('on-green'); texts.forEach(t => t.textContent = 'GO!!!'); }
    else if (step === 'IDLE') { texts.forEach(t => t.textContent = 'MENUNGGU'); }
  }

  function updateUI() {
    const btnStart = document.getElementById('btn-start');
    const btnFinish = document.getElementById('btn-finish');
    if(btnStart) btnStart.disabled = state.status !== 'idle';
    if(btnFinish) btnFinish.disabled = state.status !== 'running';
    if(state.status === 'idle') runChristmasTree('IDLE');
  }

  function tick() {
    let ms = 0;
    if(state.status === 'running' && state.startTime) ms = Date.now() - state.startTime;
    else if(state.status === 'finished' && state.startTime && state.finishTime) ms = state.finishTime - state.startTime;
    const formatted = formatTime(ms);
    if(role === 'start') document.getElementById('timer-start').textContent = formatted;
    if(role === 'finish') document.getElementById('timer-finish').textContent = formatted;
    if(role === 'monitor') document.getElementById('timer-monitor').textContent = formatted;
  }

  function formatTime(ms) {
    if(ms < 0) ms = 0;
    const m = Math.floor(ms / 60000);
    const s = Math.floor((ms % 60000) / 1000);
    const ms_frac = ms % 1000;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + '.' + String(ms_frac).padStart(3, '0');
  }

  function renderLeaderboard() {
    const tbody = document.getElementById('leaderboard-body');
    if(!tbody) return;
    if(!leaderboard.length) {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Belum ada data</td></tr>';
      return;
    }
    tbody.innerHTML = leaderboard.map((l, index) => {
      let rankClass = index === 0 ? 'rank-1' : (index === 1 ? 'rank-2' : (index === 2 ? 'rank-3' : ''));
      return `<tr class="${rankClass}"><td>${index + 1}</td><td>${l.racer}</td><td style="font-family:var(--font-display);">${formatTime(l.duration)}</td></tr>`;
    }).join('');
  }

  function exportCSV() {
    let csv = "Posisi,Nama Peserta,Waktu Tempuh (Milidetik),Waktu Format\n";
    leaderboard.forEach((l, i) => { csv += `${i+1},${l.racer},${l.duration},${formatTime(l.duration)}\n`; });
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'Leaderboard_Race.csv'; a.click();
    window.URL.revokeObjectURL(url);
  }

  function generateQR() {
    const qrContainer = document.getElementById("qrcode");
    qrContainer.innerHTML = "";
    const viewUrl = window.location.origin + '/penonton'; 
    new QRCode(qrContainer, { text: viewUrl, width: 150, height: 150, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });
  }
</script>
</body>
</html>
